<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=384,initial-scale=1,user-scalable=no">
<!-- 検索エンジンに登録させない（サイネージ用のため公開検索される必要がない） -->

<title>千葉商会 天気</title>
<style>
html,body{margin:0;padding:0;width:384px;height:96px;overflow:hidden;background:#000}
#led{position:relative;width:384px;height:96px;overflow:hidden;background:#000;color:#fff;
     font-family:"BIZ UDPGothic","Noto Sans CJK JP","Droid Sans Fallback","Yu Gothic UI","Meiryo",sans-serif}
/* レイアウトは全て絶対座標。384x96の固定キャンバスなので回り込みを一切起こさせない */
#led *{position:absolute;margin:0;padding:0;box-sizing:border-box}
/* ↑の #led * は詳細度(1,0,0)でクラス指定に勝ってしまう。
   インライン要素だけは要素セレクタ(1,0,1)で通常フローに戻す。 */
#led span,#led i{position:static}

/* --- 画面（ペイン）。フェードで入れ替える ---
   2枚を同じ位置に重ね、不透明度だけで見せ消しする。
   両方を同時に半透明にする「クロスフェード」は二重像になり、
   夜間の低輝度時に色ムラとして目立つため、
   「暗転しきってから次を出す」順番にしている（rotate() 参照）。 */
.pane{left:0;top:0;width:384px;height:96px;overflow:hidden;background:#000;opacity:0}
.pane.fade{-webkit-transition:opacity 450ms ease-in-out;
           transition:opacity 450ms ease-in-out}

/* すべて #led を付けて詳細度(1,1,0)にしている。
   付けないと上の #led *{margin:0} (1,0,0) に負けて margin-left が効かない。 */
/* ---- 天気アイコンのアニメーション ----
   ・雨/雪は opacity を使わず「雲の裏から出て枠外へ抜ける」動きにしている。
     半透明はLEDの低輝度域で色ムラになるため。SVGは viewBox 外を自動で切るので
     終端で消え、開始位置は雲の裏に隠れる＝継ぎ目なくループする。
   ・transform-origin は px で明示している。SVG要素では transform-box を使わない限り
     原点がビューポート左上になり、指定しないと回転がずれる。 */
@keyframes ledspin  {to{transform:rotate(360deg)}}
@keyframes ledpulse {0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes leddrop  {0%{transform:translateY(0)}100%{transform:translateY(26px)}}
@keyframes ledflake {0%{transform:translateY(0)}100%{transform:translateY(24px)}}
@keyframes leddrift {0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes ledbolt  {0%,55%,100%{opacity:1}72%{opacity:.35}86%{opacity:1}}
@keyframes ledfog   {0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
#led svg .rays {animation:ledspin 40s linear infinite}
#led svg .core {animation:ledpulse 5s ease-in-out infinite}
#led svg .drop {animation:leddrop 1.5s linear infinite}
#led svg .d2   {animation-delay:-.5s}
#led svg .d3   {animation-delay:-1s}
#led svg .flake{animation:ledflake 3s linear infinite}
#led svg .f2   {animation-delay:-1s}
#led svg .f3   {animation-delay:-2s}
#led svg .drift{animation:leddrift 8s ease-in-out infinite}
#led svg .bolt {animation:ledbolt 2.6s ease-in-out infinite}
#led svg .fg1  {animation:ledfog 6s ease-in-out infinite}
#led svg .fg2  {animation:ledfog 6s ease-in-out infinite;animation-delay:-2s}
#led svg .fg3  {animation:ledfog 6s ease-in-out infinite;animation-delay:-4s}
/* ---- ロゴ画面の登場演出 ----
   パーツを画面外から所定位置へ滑り込ませる。
   不透明度を一切使わないので、夜間の低輝度でも色ムラが出ない。
   減速カーブ(cubic-bezier)で最後にピタッと止めると「組み上がった」感じになる。
   飛び出す距離は向きによって違うため -200px などで差し替えている。 */
@keyframes ledinL{from{transform:translateX(-200px)}to{transform:translateX(0)}}
@keyframes ledinR{from{transform:translateX(400px)}to{transform:translateX(0)}}
@keyframes ledinU{from{transform:translateY(40px)}to{transform:translateY(0)}}
#led .inL{animation:ledinL 460ms cubic-bezier(.16,.84,.44,1) 1 both}
#led .inR{animation:ledinR 460ms cubic-bezier(.16,.84,.44,1) 1 both}
#led .inU{animation:ledinU 460ms cubic-bezier(.16,.84,.44,1) 1 both}
/* 遅延はあとに書く。先の .inL 等と同じ詳細度なので、後勝ちで上書きされる */
#led .dl1{animation-delay:0ms}
#led .dl2{animation-delay:170ms}
#led .dl3{animation-delay:320ms}
#led .dl4{animation-delay:470ms}
#led .dl5{animation-delay:580ms}
/* ---- ロゴ画面の車 ----
   右(x=400)から左(x=-110)へ1回だけ走り、走り終わったら枠外で止まる(both)。
   ロゴ画面に切り替わるたびに JS の restartCars() で先頭から流し直す。 */
@keyframes leddrive{from{transform:translateX(400px)}to{transform:translateX(-110px)}}
#led .car{animation:leddrive 5500ms linear 900ms 1 both}
#led #carB{animation-delay:2300ms}
#led .nw{white-space:nowrap}
#led .deg{font-size:.40em;font-weight:bold;vertical-align:.95em}
#led .deg2{font-size:.55em;font-weight:bold;vertical-align:.72em}
#led .lbl{font-size:15px;font-weight:bold;color:#00E5A0}
#led .pop{font-size:14px;font-weight:bold;color:#35C8FF;margin-left:9px}
#led .hi{font-size:44px;font-weight:bold;color:#FFB020}
#led .lo{font-size:23px;font-weight:bold;color:#35C8FF;margin-left:11px}
#led .hi2{font-size:30px;font-weight:bold;color:#FFB020}
#led .lo2{font-size:20px;font-weight:bold;color:#35C8FF;margin-left:11px}
#led .big{font-size:30px;font-weight:bold;color:#FFFFFF}
#led .sub{font-size:17px;font-weight:bold;color:#00E5A0}
#led .amb{color:#FFB020}
#led .cyn{color:#35C8FF}
#led .ctr{left:0;width:384px;text-align:center;white-space:nowrap}
</style></head><body><div id="led">

  AREA   : '020010',   /* 津軽地方＝弘前市が属する予報区 */
  TEMP   : '31461',    /* 気温地点：弘前 */
  TEMP_FB: '31312',    /* 予備：青森（週間予報には弘前が無いため） */
  REFRESH: 900000,     /* 15分ごとに再取得。気象庁の予報更新は5時/11時/17時の1日3回なので十分。4G SIM の通信量削減のため5分→15分に変更 */
  RETRY  : 60000,      /* 失敗時は1分後に再試行 */

  /* --- 画面ローテーション（値の変更は build.py 側で行うこと） --- */
  HOLD   : [4200, 6000, 4000, 4200, 4200, 4200, 4200, 5200],  /* 各画面を出したままにする時間（ペインと同じ並び） */
  FADE   : 450                   /* フェード時間。CSS側と必ず同じ値 */
};

/* ---------- 天気アイコン（自作SVG。線は太く、面で塗る） ----------
   すべての図形を viewBox 0 0 48 48 の内側に収めること。
   はみ出すと直線的に切り落とされて不自然な形になる。 */
var CL_HI = '#EAF4FF', CL_LO = '#3F93D4', SUN = '#FFC83D', RAIN = '#35C8FF', SNOW = '#FFFFFF';

function cloud(dx, dy, sc, cls) {
  var body = '<circle cx="21" cy="33" r="9.5"/><circle cx="31" cy="27.5" r="12"/>'
           + '<circle cx="40.5" cy="34" r="7.5"/><rect x="19" y="34" width="24.5" height="10" rx="4"/>';
  return '<g class="' + (cls || '') + '" transform="translate(' + dx + ',' + dy + ') scale(' + sc + ')">'
       + '<g fill="' + CL_LO + '" transform="translate(0,3)">' + body + '</g>'
       + '<g fill="' + CL_HI + '">' + body + '</g></g>';
}
/* 太陽。光条はゆっくり回り、中心はゆっくり脈打つ */
function sun(cx, cy, r) {
  var org = ' style="transform-origin:' + cx + 'px ' + cy + 'px"';
  var o = '<g fill="' + SUN + '"><circle class="core" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + org + '/>'
        + '<g class="rays"' + org + ' stroke="' + SUN + '" stroke-width="4.5" stroke-linecap="round">';
  var R1 = r + 4, R2 = r + 7.5, i, a;
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4;
    o += '<line x1="' + (cx + R1 * Math.cos(a)).toFixed(1) + '" y1="' + (cy + R1 * Math.sin(a)).toFixed(1)
       + '" x2="' + (cx + R2 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + R2 * Math.sin(a)).toFixed(1) + '"/>';
  }
  return o + '</g></g>';
}
function shift(dx, dy, inner) {
  return '<g transform="translate(' + dx + ',' + dy + ')">' + inner + '</g>';
}
/* 雨粒。開始位置(y24-31)は雲の裏、translateY(26) で枠外へ抜けて自動的に切られる */
function drops() {
  var o = '<g stroke="' + RAIN + '" stroke-width="4" stroke-linecap="round">', i;
  var xs = [17, 27, 37], cl = ['drop', 'drop d2', 'drop d3'];
  for (i = 0; i < 3; i++) {
    o += '<line class="' + cl[i] + '" x1="' + xs[i] + '" y1="24" x2="' + (xs[i] - 3) + '" y2="31"/>';
  }
  return o + '</g>';
}
/* 雪。雨より遅く落とす */
function flakes() {
  var o = '<g fill="' + SNOW + '">', i;
  var xs = [16, 27, 38], cl = ['flake', 'flake f2', 'flake f3'];
  for (i = 0; i < 3; i++) {
    o += '<circle class="' + cl[i] + '" cx="' + xs[i] + '" cy="28" r="3.2"/>';
  }
  return o + '</g>';
}
/* 描画順に注意：雨粒・雪は雲より先に描く（雲の裏から出てくるようにするため） */
var ICON = {
  sun     : function () { return sun(24, 24, 12); },
  partly  : function () { return sun(17, 17, 9) + cloud(0, 0, 1); },
  cloudy  : function () { return shift(-6, -6, cloud(0, 0, 1, 'drift')); },
  rain    : function () { return shift(-5, 0, drops() + cloud(0, -9, 0.95)); },
  rainsun : function () { return shift(-5, 0, sun(15, 15, 7.5) + drops() + cloud(0, -9, 0.9)); },
  snow    : function () { return shift(-5, 0, flakes() + cloud(0, -9, 0.95)); },
  snowsun : function () { return shift(-5, 0, sun(15, 15, 7.5) + flakes() + cloud(0, -9, 0.9)); },
  sleet   : function () { return shift(-5, 0,
                            '<g stroke="' + RAIN + '" stroke-width="4" stroke-linecap="round">'
                          + '<line class="drop" x1="18" y1="24" x2="15" y2="31"/>'
                          + '<line class="drop d3" x1="34" y1="24" x2="31" y2="31"/></g>'
                          + '<g fill="' + SNOW + '"><circle class="flake f2" cx="26" cy="28" r="3.2"/></g>'
                          + cloud(0, -9, 0.95)); },
  thunder : function () { return shift(-4, 0, cloud(0, -10, 0.92)
                          + '<polygon class="bolt" points="27,31 18,42 25,42 21,48 33,38 26,38 31,31" fill="#FFE14D"/>'); },
  fog     : function () { return '<g stroke="' + CL_HI + '" stroke-width="5" stroke-linecap="round">'
                          + '<line class="fg1" x1="9" y1="16" x2="39" y2="16"/>'
                          + '<line class="fg2" x1="13" y1="26" x2="43" y2="26"/>'
                          + '<line class="fg3" x1="9" y1="36" x2="39" y2="36"/></g>'; }
};

/* 気象庁の天気文(weathers)から種別を決める。
   コード表(100〜450)を網羅するより文字列判定のほうが取りこぼしが少ない。 */
function pickIcon(text) {
  var t = text || '';
  var hasSun  = t.indexOf('晴') >= 0;
  var hasCld  = t.indexOf('くもり') >= 0 || t.indexOf('曇') >= 0;
  var hasRain = t.indexOf('雨') >= 0;
  var hasSnow = t.indexOf('雪') >= 0;
  if (t.indexOf('雷') >= 0) return 'thunder';
  if (t.indexOf('霧') >= 0) return 'fog';
  if (hasRain && hasSnow) return 'sleet';
  if (hasSnow) return hasSun ? 'snowsun' : 'snow';
  if (hasRain) return hasSun ? 'rainsun' : 'rain';
  if (hasSun && hasCld) return 'partly';
  if (hasSun) return 'sun';
  return 'cloudy';
}
/* 天気が変わっていないときは作り直さない。
   毎回 innerHTML を書き換えると5分ごとにアニメーションが先頭に巻き戻ってしまう。 */
var iconCache = {};
function setIcon(elId, kind, size) {
  if (iconCache[elId] === kind) return;
  iconCache[elId] = kind;
  document.getElementById(elId).innerHTML =
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48"'
    + ' style="position:absolute;left:0;top:0">' + ICON[kind]() + '</svg>';
}

/* ---------------- 日付ユーティリティ ---------------- */
var WD = ['日', '月', '火', '水', '木', '金', '土'];
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function key(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dkey(iso) { return iso.slice(0, 10); }
function dhour(iso) { return parseInt(iso.slice(11, 13), 10); }

/* ---------------- 気象庁JSONの解析 ---------------- */
function findSeries(ts, prop) {
  for (var i = 0; i < ts.length; i++) {
    var a = ts[i].areas;
    if (a && a.length && a[0][prop] !== undefined) return ts[i];
  }
  return null;
}
function areaByCode(series, code) {
  if (!series) return null;
  for (var i = 0; i < series.areas.length; i++) {
    if (series.areas[i].area.code === code) return series.areas[i];
  }
  return series.areas[0];
}

/* 戻り値： out['YYYY-MM-DD'] = {text, pop, max, min} */
function parseJMA(json) {
  var out = {};
  function slot(k) {
    if (!out[k]) out[k] = { text: null, pop: null, max: null, min: null };
    return out[k];
  }
  var ts = json[0].timeSeries, i;

  /* 天気 */
  var wS = findSeries(ts, 'weatherCodes'), wA = areaByCode(wS, CFG.AREA);
  if (wS && wA) for (i = 0; i < wS.timeDefines.length; i++) {
    slot(dkey(wS.timeDefines[i])).text = wA.weathers[i];
  }

  /* 降水確率：同じ日のうち最大値を採る */
  var pS = findSeries(ts, 'pops'), pA = areaByCode(pS, CFG.AREA);
  if (pS && pA) for (i = 0; i < pS.timeDefines.length; i++) {
    var pv = parseInt(pA.pops[i], 10);
    if (isNaN(pv)) continue;
    var ps = slot(dkey(pS.timeDefines[i]));
    if (ps.pop === null || pv > ps.pop) ps.pop = pv;
  }

  /* 気温：00時台=最低 / それ以外(09時台)=最高 */
  var tS = findSeries(ts, 'temps'), tA = areaByCode(tS, CFG.TEMP);
  if (tS && tA) for (i = 0; i < tS.timeDefines.length; i++) {
    var tv = parseInt(tA.temps[i], 10);
    if (isNaN(tv)) continue;
    var s = slot(dkey(tS.timeDefines[i]));
    if (dhour(tS.timeDefines[i]) < 6) { if (s.min === null) s.min = tv; }
    else { if (s.max === null) s.max = tv; }
  }

  /* 週間予報で欠けを補う（週間の気温地点に弘前が無いので青森で代用） */
  if (json[1] && json[1].timeSeries) {
    var wk = findSeries(json[1].timeSeries, 'tempsMax'), kA = areaByCode(wk, CFG.TEMP_FB);
    if (wk && kA) for (i = 0; i < wk.timeDefines.length; i++) {
      var s2 = slot(dkey(wk.timeDefines[i]));
      var mx = parseInt(kA.tempsMax[i], 10), mn = parseInt(kA.tempsMin[i], 10);
      if (s2.max === null && !isNaN(mx)) s2.max = mx;
      if (s2.min === null && !isNaN(mn)) s2.min = mn;
    }
    var wp = findSeries(json[1].timeSeries, 'pops'), pA2 = areaByCode(wp, CFG.AREA);
    if (wp && pA2) for (i = 0; i < wp.timeDefines.length; i++) {
      var s3 = slot(dkey(wp.timeDefines[i]));
      var pv2 = parseInt(pA2.pops[i], 10);
      if (s3.pop === null && !isNaN(pv2)) s3.pop = pv2;
    }
  }
  return out;
}

/* ---------------- 描画 ---------------- */
function txt(id, v) { document.getElementById(id).innerHTML = v; }
/* その画面に無いこともある要素向け。無ければ何もしない */
function txtIf(id, v) { var e = document.getElementById(id); if (e) e.innerHTML = v; }
function nz(v) { return (v === undefined || v === null) ? null : v; }
function degHi(v) { return v === null ? '--' : (v + '<i class="deg">°</i>'); }
function degLo(v) { return v === null ? ''   : (v + '<i class="deg2">°</i>'); }

/* 最後に描画したデータと、その時点の日付を覚えておく。
   通信が切れたまま日付が変わったときに、古い予報を「今日」として出し続けないため。 */
var lastData = null, lastDay = '';

function render(data) {
  var now = new Date();
  lastData = data;
  lastDay = key(now);
  var a = data[key(now)] || {};
  var b = data[key(new Date(now.getTime() + 86400000))] || {};

  /* 気象庁は11時以降の発表で「今日の最低気温」枠に観測済みの値を入れるため、
     最高と同値になることがある。同値・欠損のときは最低を出さない。 */
  var aMin = (nz(a.min) === nz(a.max)) ? null : nz(a.min);
  var bMin = (nz(b.min) === nz(b.max)) ? null : nz(b.min);

  setIcon('ic1', pickIcon(a.text), 64);
  setIcon('ic2', pickIcon(b.text), 44);
  txt('h1', degHi(nz(a.max)));
  txt('l1', degLo(aMin));
  txt('h2', degHi(nz(b.max)));
  txt('l2', degLo(bMin));
  txt('pop1', nz(a.pop) === null ? '' : (a.pop + '%'));
  txt('pop2', nz(b.pop) === null ? '' : (b.pop + '%'));
  layout();
}

/* 「アイコン＋文字」を1つのかたまりとして列の中央に置く。
   文字幅はデータで変わる（最低気温の有無・氷点下の符号・3桁の降水確率）ため、
   固定座標では必ずどこかに穴が空く。描画のたびに実測して置き直す。 */
function centerGroup(colX, colW, icoId, icoW, aId, bId, gap) {
  var ico = document.getElementById(icoId);
  var A = document.getElementById(aId), B = document.getElementById(bId);
  A.style.width = 'auto'; B.style.width = 'auto';
  var w = Math.max(A.offsetWidth, B.offsetWidth);
  var x = colX + Math.round((colW - (icoW + gap + w)) / 2);
  if (x < colX) x = colX;
  ico.style.left = x + 'px';
  A.style.left = B.style.left = (x + icoW + gap) + 'px';
  A.style.width = B.style.width = w + 'px';
}

function layout() {
  centerGroup(0, 204, 'ic1', 64, 't1a', 't1b', 10);
  centerGroup(208, 176, 'ic2', 44, 't2a', 't2b', 8);
}

var lastOK = 0;
function tick() {
  var d = new Date();
  txt('date', (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')');
  txt('time', d.getHours() + ':' + pad2(d.getMinutes()));
  txtIf('date2', (d.getMonth() + 1) + '月' + d.getDate() + '日 (' + WD[d.getDay()] + ')');
  txtIf('time2', d.getHours() + ':' + pad2(d.getMinutes()));
  /* 日付が変わったら、取得を待たずにその場で描画し直す。
     0時をまたいだ瞬間に「今日/明日」が正しくずれる。
     通信が切れていて手持ちのデータに当日分が無ければ、自動的に "--" になる
     （古い予報を今日の天気として出し続けない）。 */
  if (lastData && key(d) !== lastDay) render(lastData);
}

/* ---------------- 画面ローテーション ----------------
   「ふわっと消える → 一度真っ黒 → ふわっと現れる」の順で入れ替える。
   2枚を同時に半透明にしないので二重像が出ず、低輝度時もきれいに見える。 */
var PANES = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8'];
var cur = 0;

function setOp(el, v, animate) {
  el.className = animate ? 'pane fade' : 'pane';
  el.style.opacity = v;
}

/* ロゴ画面の演出（パーツの飛び込みと車）を先頭から流し直す。
   ペインは常にDOM上にあるため、放っておくと画面に出ていない間に終わってしまう。
   一度 animation を none にして強制的にレイアウトを確定させてから戻すのが確実な作法。 */
function restartPane(id) {
  var p = document.getElementById(id);
  if (!p) return;
  var els = p.getElementsByTagName('*'), i, e;
  for (i = 0; i < els.length; i++) {
    e = els[i];
    /* 流し直す対象は class に anim を付けた要素だけ。
       天気アイコンの常時アニメーション（雨粒・光条など）は巻き戻してはいけない。 */
    if (('' + (e.className || '')).indexOf('anim') < 0) continue;
    e.style.animation = 'none';
    void e.offsetWidth;
    e.style.animation = '';
  }
}

function rotate() {
  var from = document.getElementById(PANES[cur]);
  var nextIdx = (cur + 1) % PANES.length;
  var to = document.getElementById(PANES[nextIdx]);

  setOp(from, 0, true);                  /* ふわっと消す */
  setTimeout(function () {
    restartPane(PANES[nextIdx]);         /* 入る瞬間に、その画面の演出を流し直す */
    setOp(to, 1, true);                  /* 暗転しきってから、ふわっと出す */
    setTimeout(function () {
      cur = nextIdx;
      setTimeout(rotate, CFG.HOLD[cur]);
    }, CFG.FADE + 80);
  }, CFG.FADE + 80);
}

/* ---------------- 直前データの保存と復元 ----------------
   番組のループやTaurusの再起動でページが読み直されると、
   気象庁から取り直すまでの1〜2秒間 "--" が出てしまう。
   最後に取得できたJSONを端末内に保存しておき、起動直後はそれを即座に描画する。
   停電復帰などでネットワークがまだ繋がっていない場合も、前回の内容を出したまま待てる。
   保存できない環境（プライベートモード等）でも動くよう、必ず try で囲む。 */
var CACHE_KEY = 'ledWeatherCache';

function saveCache(text) {
  try {
    window.localStorage.setItem(CACHE_KEY, (new Date()).getTime() + '|' + text);
  } catch (e) { /* 保存できなくても表示には影響しないので握りつぶす */ }
}

function loadCache() {
  var raw = null;
  try { raw = window.localStorage.getItem(CACHE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  var p = raw.indexOf('|');
  if (p < 0) return false;
  var saved = parseInt(raw.slice(0, p), 10);
  /* 24時間以上前のものは古すぎるので使わない（前日の予報を出し続けないため） */
  if (!saved || (new Date()).getTime() - saved > 86400000) return false;
  try {
    render(parseJMA(JSON.parse(raw.slice(p + 1))));
  } catch (e2) { return false; }
  return true;
}

/* ---------------- 取得 ---------------- */
function load() {
  var url = (CFG.MODE === 'local' ? CFG.LOCAL : CFG.JMA);
  url += (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + (new Date()).getTime();

  var x = new XMLHttpRequest(), done = false;
  function fail() {
    if (done) return;
    done = true;
    /* 失敗しても直前の表示はそのまま残す（画面を空白にしない） */
    setTimeout(load, CFG.RETRY);
  }
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || done) return;
    if (x.status >= 200 && x.status < 300) {
      var j;
      try { j = JSON.parse(x.responseText); } catch (e) { fail(); return; }
      try { render(parseJMA(j)); } catch (e2) { fail(); return; }
      done = true;
      lastOK = (new Date()).getTime();
      saveCache(x.responseText);   /* 次回起動時に即表示するため保存 */
      setTimeout(load, CFG.REFRESH);
    } else { fail(); }
  };
  x.onerror = fail;
  x.ontimeout = fail;
  try {
    x.open('GET', url, true);
    x.timeout = 20000;
    x.send(null);
  } catch (e3) { fail(); }
}

/* ---------------- 起動 ---------------- */
layout();
setOp(document.getElementById('s1'), 1, false);   /* 天気を最初に出す */
setOp(document.getElementById('s2'), 0, false);
tick();
setInterval(tick, 20000);
loadCache();   /* まず前回の値を出す（起動直後に -- を見せない） */
load();         /* そのうえで最新を取りに行く */
setTimeout(rotate, CFG.HOLD[0]);
</script>
</body></html>
